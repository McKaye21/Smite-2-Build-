function icon(name, size, color, sw) {
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${color||'currentColor'}" `

    + (ICONS[name]||'') + `</svg>`;
}

/* ----------------------- build generation ----------------------- */
function forgeBuild(god, role, mode, objectives) {
  const objs = new Set(objectives);
  if (mode === "Assault") { objs.add("antiheal"); objs.add("lifesteal"); }
  if (mode === "Arena") objs.add("power");
  if (mode === "Duel") { objs.add("health"); objs.add("physdef"); }

  const isDef = role === "Support";
  const wantsDamage = ["power","pen","attackspeed","crit","lifesteal","cooldown"].some(k => objs.has(k));

  // Smite 2 has no item restrictions — any god can buy any item. We still
  // prefer items that match a god's scaling stat (Strength/Intelligence), but
  // crit is a basic-attack stat that works for everyone, so crit items are
  // eligible for any god whenever crit is a chosen goal.
  const crossType = objs.has("crit") ? ["crit"] : [];
  const eligible = ITEMS.filter(it =>
    it.dmg === "both" || it.dmg === god.dmg || it.tags.some(t => crossType.includes(t))
  );

  const scored = eligible.map(it => {
    let s = 0;
    it.tags.forEach(t => { if (objs.has(t)) s += 3; });
    if (isDef && (it.tags.includes("aura") || it.tags.includes("cc"))) s += 2;
    if (role === "Solo" && (it.tags.includes("physdef") || it.tags.includes("magdef"))) s += 1;
    if (wantsDamage && it.tags.includes("power") && !isDef) s += 1;
    return Object.assign({}, it, { score:s });
  }).sort((a,b) => b.score - a.score || a.n.localeCompare(b.n));

  const build = [], used = new Set();
  const starter = STARTERS[role+"-"+god.dmg] || STARTERS[role+"-int"] || "Bluestone Pendant";
  build.push({ n:starter, why:role+" starter for a "+(god.dmg==="str"?"Strength":"Intelligence")+" god", starter:true });

  const push = it => {
    if (!it || used.has(it.n) || build.length >= 6) return;
    used.add(it.n);
    const matched = it.tags.filter(t => objs.has(t)).map(t => OBJ_LABEL[t] || t);
    build.push({ n:it.n, dmg:it.dmg, why: matched.length ? matched.join(" · ") : "Core efficiency pick" });
  };

  if (wantsDamage && !objs.has("physdef") && !objs.has("magdef")) push(scored.find(it => it.tags.includes("pen")));
  if (isDef) push(scored.find(it => it.tags.includes("aura")));
  for (const it of scored) { if (build.length >= 6) break; push(it); }
  for (const it of scored) { if (build.length >= 6) break; push(it); }
  return build.slice(0, 6);
}

function buildStrategy(god, role, mode, objs) {
  const p = [], power = god.dmg === "str" ? "Strength" : "Intelligence";
  p.push(`This build leans into ${god.n}'s ${power} scaling for the ${role} role in ${mode}.`);
  if (objs.includes("pen")) p.push("Penetration lets your damage cut through enemy tanks and bruisers who stack protections.");
  if (objs.includes("crit")) p.push("Crit ramps hard once you hit two crit items — pair it with attack speed to spike your basics.");
  if (objs.includes("lifesteal")) p.push("Lifesteal keeps you healthy in extended fights and lane, so you can stay aggressive.");
  if (objs.includes("cooldown")) p.push("Cooldown lets you cast abilities more often — huge for ability-based gods and rotations.");
  if (objs.includes("antiheal")) p.push("Anti-heal is essential into healers and sustain gods; buy it before it's too late, not after.");
  if (objs.includes("physdef")) p.push("Physical protection blunts basic-attack carries and physical junglers.");
  if (objs.includes("magdef")) p.push("Magical protection is your answer to burst mages in the mid lane.");
  if (objs.includes("health")) p.push("Raw health makes protections and lifesteal more effective and helps you survive burst.");
  if (objs.includes("movement")) p.push("Movement speed improves your rotations, chases, and escapes.");
  if (objs.includes("aura") || role === "Support") p.push("Aura items share value with your whole team — that's where a support's gold does the most work.");
  if (mode === "Assault") p.push("Assault has no recall, so the anti-heal and sustain here matter more than usual.");
  if (mode === "Arena") p.push("Arena is nonstop teamfighting — favor items that come online fast.");
  if (mode === "Duel" || role === "Solo") p.push("As a lone bruiser you want to be self-sufficient: enough damage to threaten, enough bulk to survive.");
  return p.join(" ");
}

/* ----------------------------- view ----------------------------- */
function esc(s){ return String(s).replace(/"/g,"&quot;"); }

function godEmblem(god, size) {
  const pc = PANTHEON[god.p] || ["#555","#999"];
  const a = pc[0], b = pc[1];
  const initials = god.n.split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
  const ring = dmgColor(god.dmg);
  const badge = icon(god.atk === "Melee" ? "sword" : "crosshair", size*0.22, ring, 2.4);
  let h = `<div style="position:relative;width:${size}px;height:${size}px;flex:none">`;
  h += `<div style="width:${size}px;height:${size}px;border-radius:50%;background:radial-gradient(circle at 30% 25%, ${b}, ${a} 75%);`
     + `display:flex;align-items:center;justify-content:center;border:2px solid ${ring};`
     + `box-shadow:0 0 0 1px ${C.obsidian},0 2px 8px rgba(0,0,0,.5);font-family:Cinzel,serif;font-weight:800;`
     + `font-size:${Math.round(size*0.32)}px;color:${C.obsidian};letter-spacing:.5px">${initials}</div>`;
  if (god.img) {
    h += `<img src="${esc(god.img)}" alt="" onerror="this.remove()" style="position:absolute;inset:0;width:${size}px;`
       + `height:${size}px;border-radius:50%;object-fit:cover;border:2px solid ${ring};`
       + `box-shadow:0 0 0 1px ${C.obsidian},0 2px 8px rgba(0,0,0,.5)">`;
  }
  h += `<div style="position:absolute;bottom:-2px;right:-2px;width:${size*0.4}px;height:${size*0.4}px;border-radius:50%;`
     + `background:${C.stone};border:1.5px solid ${ring};display:flex;align-items:center;justify-content:center">${badge}</div>`;
  h += `</div>`;
  return h;
}

function eyebrow(n, sub) {
  return `<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:4px">`
    + `<span style="font-family:Cinzel,serif;font-weight:700;color:${C.bronze};font-size:13px;letter-spacing:3px">${n}</span>`
    + `<span style="height:1px;flex:1;background:linear-gradient(90deg, ${C.edge}, transparent)"></span>`
    + `<span style="color:${C.muted};font-size:12px;letter-spacing:1px">${sub}</span></div>`;
}
function chip(label, dot) {
  return `<span style="display:inline-flex;align-items:center;gap:7px;background:${C.stone};border:1px solid ${C.edge};`
    + `border-radius:20px;padding:5px 13px;font-size:12.5px;font-weight:600;letter-spacing:.5px">`
    + (dot ? `<span style="width:8px;height:8px;border-radius:50%;background:${dot}"></span>` : "") + label + `</span>`;
}
const H2 = t => `<h2 style="font-family:Cinzel,serif;font-weight:700;font-size:26px;margin:2px 0 18px">${t}</h2>`;
const cardStyle = sel =>
  `background:${sel?C.stone2:C.stone};border:1px solid ${sel?C.bronze:C.edge};border-radius:12px;cursor:pointer;`
  + (sel ? `box-shadow:0 0 0 1px ${C.bronze},0 4px 14px rgba(0,0,0,.4);` : "");

const state = { step:1, god:null, mode:null, role:null, objs:new Set(), q:"", pFilter:"All", result:null, focusSearch:false };
const pantheons = ["All", ...Array.from(new Set(GODS.map(g => g.p))).sort()];

function godGridHTML() {
  const list = GODS.filter(g =>
    (state.pFilter === "All" || g.p === state.pFilter) &&
    (state.q.trim() === "" || g.n.toLowerCase().includes(state.q.toLowerCase()))
  ).sort((a,b) => a.n.localeCompare(b.n));
  if (!list.length) return `<div style="color:${C.muted};text-align:center;padding:40px">No gods match that search.</div>`;
  return `<div style="display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">` +
    list.map(g => {
      const sel = state.god && state.god.n === g.n;
      return `<div class="hoverable" data-action="pickGod" data-val="${esc(g.n)}" style="${cardStyle(sel)}padding:12px;display:flex;align-items:center;gap:11px">`
        + godEmblem(g, 46)
        + `<div style="min-width:0">`
        + `<div style="font-family:Cinzel,serif;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${g.n}</div>`
        + `<div style="color:${C.muted};font-size:11px">${g.atk} · ${g.p}</div>`
        + `<div style="color:${dmgColor(g.dmg)};font-size:10px;font-weight:700;letter-spacing:1px;margin-top:2px">${g.dmg==="str"?"STRENGTH":"INTELLIGENCE"}</div>`
        + `</div></div>`;
    }).join("") + `</div>`;
}

function stepTracker() {
  const steps = ["God","Mode","Role","Goals"];
  return `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">` + steps.map((s,i) => {
    const n=i+1, done=state.step>n, cur=state.step===n;
    const dot = `<div style="width:24px;height:24px;border-radius:50%;background:${done?C.bronze:cur?"transparent":C.stone};`
      + `border:1.5px solid ${done||cur?C.bronze:C.edge};color:${done?C.obsidian:cur?C.bronze:C.muted};`
      + `font-family:Cinzel,serif;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center">`
      + (done ? icon("check",13,C.obsidian,2.5) : n) + `</div>`;
    const lbl = `<span style="font-size:11px;letter-spacing:1px;color:${cur?C.parch:C.muted};font-family:Cinzel,serif;font-weight:600">${s}</span>`;
    return `<div style="display:flex;align-items:center;gap:6px">${dot}${lbl}</div>`
      + (i<3 ? `<span style="width:14px;height:1px;background:${C.edge}"></span>` : "");
  }).join("") + `</div>`;
}

function ribbon() {
  if (state.result) return "";
  const bits = [];
  if (state.god) bits.push(chip(state.god.n, dmgColor(state.god.dmg)));
  if (state.mode) bits.push(chip(state.mode));
  if (state.role) bits.push(chip(state.role));
  if (state.objs.size) bits.push(chip(state.objs.size + " goal" + (state.objs.size>1?"s":"")));
  if (!bits.length) return "";
  return `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px">${bits.join("")}</div>`;
}

function stepGod() {
  return `<section>${eyebrow("STEP I","Choose your god")}${H2("Who steps onto the battleground?")}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px;background:${C.stone};border:1px solid ${C.edge};border-radius:9px;padding:8px 12px;flex:1 1 220px">
        ${icon("search",16,C.muted)}
        <input id="godSearch" value="${esc(state.q)}" placeholder="Search gods…" autocomplete="off"
          style="background:transparent;border:none;outline:none;color:${C.parch};font-size:15px;width:100%">
      </div>
      <select id="pFilter" style="background:${C.stone};color:${C.parch};border:1px solid ${C.edge};border-radius:9px;padding:8px 30px 8px 12px;font-size:14px;cursor:pointer">
        ${pantheons.map(p => `<option value="${p}" ${p===state.pFilter?"selected":""}>${p==="All"?"All pantheons":p}</option>`).join("")}
      </select>
    </div>
    <div id="godGrid">${godGridHTML()}</div>
  </section>`;
}

function stepMode() {
  return `<section>${eyebrow("STEP II","Choose a game mode")}${H2("Where is the battle fought?")}
    <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">
      ${MODES.map(m => {
        const sel = state.mode === m.n;
        return `<div class="hoverable" data-action="pickMode" data-val="${esc(m.n)}" style="${cardStyle(sel)}padding:18px">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="font-family:Cinzel,serif;font-weight:700;font-size:18px">${m.n}</span>
            ${sel ? icon("check",18,C.bronze) : ""}
          </div>
          <p style="color:${C.muted};font-size:13.5px;margin:8px 0 0;line-height:1.5">${m.d}</p>
        </div>`;
      }).join("")}
    </div></section>`;
}

function stepRole() {
  return `<section>${eyebrow("STEP III","Choose your role")}${H2("What part will "+state.god.n+" play?")}
    <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
      ${ROLES.map(r => {
        const sel = state.role === r.n;
        const rec = state.god.r.includes(r.n);
        return `<div class="hoverable" data-action="pickRole" data-val="${esc(r.n)}" style="${cardStyle(sel)}padding:18px">
          <div style="display:flex;align-items:center;gap:10px">
            ${icon(r.ic,20,sel?C.bronze:C.muted)}
            <span style="font-family:Cinzel,serif;font-weight:700;font-size:17px;margin-right:auto">${r.n}</span>
            ${sel ? icon("check",17,C.bronze) : ""}
          </div>
          <p style="color:${C.muted};font-size:13px;margin:10px 0 0;line-height:1.5">${r.d}</p>
          ${rec ? `<div style="margin-top:10px;display:inline-flex;align-items:center;gap:5px;color:${dmgColor(state.god.dmg)};font-size:11px;font-weight:700;letter-spacing:1px">${icon("crown",12,dmgColor(state.god.dmg))} RECOMMENDED</div>` : ""}
        </div>`;
      }).join("")}
    </div></section>`;
}

function stepGoals() {
  return `<section>${eyebrow("STEP IV","What do you want to accomplish?")}${H2("Pick your priorities")}
    <p style="color:${C.muted};font-size:14px;margin:0 0 18px">Choose one or more goals. The forge weighs items toward what you pick — and toward ${state.god.n}'s ${state.god.dmg==="str"?"Strength":"Intelligence"} scaling.</p>
    <div style="display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">
      ${OBJECTIVES.map(o => {
        const sel = state.objs.has(o.k);
        return `<div class="hoverable" data-action="toggleObj" data-val="${o.k}" style="${cardStyle(sel)}padding:14px 16px;display:flex;align-items:center;gap:12px">
          <div style="width:34px;height:34px;border-radius:8px;flex:none;background:${sel?C.bronze:C.obsidian};border:1px solid ${sel?C.bronze:C.edge};display:flex;align-items:center;justify-content:center">${icon(o.ic,17,sel?C.obsidian:C.muted)}</div>
          <span style="font-weight:600;font-size:14.5px;line-height:1.25">${o.n}</span>
          ${sel ? `<span style="margin-left:auto">${icon("check",16,C.bronze)}</span>` : ""}
        </div>`;
      }).join("")}
    </div></section>`;
}

function resultView() {
  const g = state.god, build = state.result;
  const items = build.map((it,i) => {
    const border = it.starter ? C.bronze : (it.dmg && it.dmg !== "both" ? dmgColor(it.dmg) : C.edge);
    const tag = it.starter
      ? `<span style="font-size:9.5px;letter-spacing:1px;color:${C.bronze};font-weight:700">STARTER</span>`
      : (it.dmg && it.dmg !== "both"
        ? `<span style="font-size:9.5px;letter-spacing:1px;color:${dmgColor(it.dmg)};font-weight:700">${it.dmg==="str"?"STR":"INT"}</span>`
        : `<span style="font-size:9.5px;letter-spacing:1px;color:${C.muted};font-weight:700">DEF/UTIL</span>`);
    return `<div style="background:linear-gradient(160deg, ${C.stone2}, ${C.stone});border:1px solid ${C.edge};border-radius:12px;padding:14px;position:relative;overflow:hidden;animation:slotIn .4s ease both;animation-delay:${i*70}ms">
      <div style="position:absolute;top:0;left:0;width:4px;height:100%;background:${border}"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <span style="width:26px;height:26px;border-radius:6px;background:${C.obsidian};border:1px solid ${C.edge};display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:800;font-size:12px;color:${C.bronze}">${i+1}</span>
        ${tag}
      </div>
      <div style="font-family:Cinzel,serif;font-weight:700;font-size:15px;line-height:1.2;margin-bottom:6px">${it.n}</div>
      <div style="color:${C.muted};font-size:11.5px;line-height:1.45">${it.why}</div>
    </div>`;
  }).join("");

  return `<section>
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px">
      ${godEmblem(g,64)}
      <div style="margin-right:auto;min-width:200px">
        ${eyebrow("THE FORGE SPEAKS","Recommended build")}
        <h2 style="font-family:Cinzel,serif;font-weight:800;font-size:26px;margin:0">${g.n} — ${state.role}</h2>
        <div style="color:${C.muted};font-size:13px;margin-top:3px">${state.mode} · ${g.atk} · <span style="color:${dmgColor(g.dmg)};font-weight:700">${g.dmg==="str"?"Strength":"Intelligence"}</span></div>
      </div>
      <div style="display:flex;gap:8px">
        <button data-action="edit" style="background:transparent;color:${C.muted};border:1px solid ${C.edge};border-radius:8px;padding:9px 14px;cursor:pointer;font-family:Cinzel,serif;font-weight:700;font-size:12px">Edit goals</button>
        <button data-action="reset" style="background:transparent;color:${C.bronze};border:1px solid ${C.bronzeDim};border-radius:8px;padding:9px 14px;cursor:pointer;font-family:Cinzel,serif;font-weight:700;font-size:12px;display:flex;align-items:center;gap:6px">${icon("rotate",14,C.bronze)} Start over</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px">${[...state.objs].map(k => chip(OBJ_LABEL[k], C.bronze)).join("")}</div>
    <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));margin-bottom:22px">${items}</div>
    <div style="background:${C.stone};border:1px solid ${C.edge};border-left:3px solid ${C.bronze};border-radius:10px;padding:16px 18px">
      <div style="font-family:Cinzel,serif;font-weight:700;font-size:13px;letter-spacing:2px;color:${C.bronze};margin-bottom:8px">BATTLE NOTES</div>
      <p style="margin:0;font-size:14px;line-height:1.65;color:${C.parch}">${buildStrategy(g, state.role, state.mode, [...state.objs])}</p>
    </div>
    <p style="color:${C.muted};font-size:11.5px;line-height:1.6;margin-top:16px">Buy the starter first, then build items 2→6 in order, but stay flexible: rush anti-heal earlier vs. heavy healing, and swap a damage item for a protection item if you're being bursted. This is a template, not a script.</p>
  </section>`;
}

function footerNav() {
  if (state.result) return "";
  const canForge = state.god && state.mode && state.role && state.objs.size > 0;
  const btn = (active, extra) => `background:${active?C.bronze:"transparent"};color:${active?C.obsidian:C.muted};`
    + `border:1px solid ${active?C.bronze:C.edge};border-radius:8px;padding:10px 20px;cursor:${active?"pointer":"default"};`
    + `font-family:Cinzel,serif;font-weight:700;letter-spacing:1px;font-size:13px;display:inline-flex;align-items:center;gap:8px;${extra||""}`;
  const back = `<button data-action="back" style="${btn(state.step>1)}${state.step>1?"":"opacity:.35"}">${icon("chevleft",16,state.step>1?C.obsidian:C.muted)} Back</button>`;
  let right;
  if (state.step < 4) {
    const ok = (state.step===1&&state.god)||(state.step===2&&state.mode)||(state.step===3&&state.role);
    right = `<button data-action="next" style="${btn(ok)}">Continue ${icon("chevright",16,ok?C.obsidian:C.muted)}</button>`;
  } else {
    right = `<button data-action="forge" style="${btn(canForge)}">${icon("flame",16,canForge?C.obsidian:C.muted)} Forge Build</button>`;
  }
  return `<div style="max-width:1080px;margin:26px auto 0;padding:0 20px;display:flex;justify-content:space-between;align-items:center;gap:12px">${back}${right}</div>`;
}

function disclaimer() {
  if (state.result) return "";
  return `<div style="max-width:1080px;margin:22px auto 0;padding:0 20px">
    <p style="color:${C.muted};font-size:11.5px;line-height:1.6;border-top:1px solid ${C.edge};padding-top:14px">
    Fan-made Smite 2 tool, not affiliated with Hi-Rez. Builds are generated from itemization principles (real Smite 2 items matched to your god's damage type, role & goals) — a strong starting point, not scraped pro win-rates. Item balance shifts each patch; adapt to the enemy team in the loading screen. God tiles are stylized emblems, not official art.</p></div>`;
}

function render() {
  let body;
  if (state.result) body = resultView();
  else if (state.step === 1) body = stepGod();
  else if (state.step === 2) body = stepMode();
  else if (state.step === 3) body = stepRole();
  else body = stepGoals();

  document.getElementById("app").innerHTML =
    `<div style="border-bottom:1px solid ${C.edge};padding:calc(18px + env(safe-area-inset-top)) 20px 18px;background:rgba(13,14,20,.7);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20">
      <div style="max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        ${icon("hammer",26,C.bronze)}
        <div style="margin-right:auto">
          <div style="font-family:Cinzel,serif;font-weight:900;font-size:22px;letter-spacing:2px;line-height:1">BUILD FORGE</div>
          <div style="color:${C.muted};font-size:12px;letter-spacing:3px;margin-top:3px">SMITE 2 · ITEMIZATION ASSISTANT</div>
        </div>
        ${stepTracker()}
      </div>
    </div>
    <div style="max-width:1080px;margin:0 auto;padding:26px 20px 0">${ribbon()}${body}</div>
    ${footerNav()}${disclaimer()}`;

  if (state.step === 1 && !state.result) {
    const s = document.getElementById("godSearch");
    if (s) {
      s.addEventListener("input", e => {
        state.q = e.target.value;
        document.getElementById("godGrid").innerHTML = godGridHTML();
      });
      const f = document.getElementById("pFilter");
      f.addEventListener("change", e => {
        state.pFilter = e.target.value;
        document.getElementById("godGrid").innerHTML = godGridHTML();
      });
      if (state.focusSearch) { s.focus(); const v = s.value; s.setSelectionRange(v.length, v.length); state.focusSearch = false; }
    }
  }
}

document.getElementById("app").addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const act = el.getAttribute("data-action");
  const val = el.getAttribute("data-val");
  if (act === "pickGod") { state.god = GODS.find(g => g.n === val);
    if (!state.god.r.includes(state.role)) { /* keep */ } render(); }
  else if (act === "pickMode") { state.mode = val; render(); }
  else if (act === "pickRole") { state.role = val; render(); }
  else if (act === "toggleObj") { state.objs.has(val) ? state.objs.delete(val) : state.objs.add(val); render(); }
  else if (act === "next") {
    const ok = (state.step===1&&state.god)||(state.step===2&&state.mode)||(state.step===3&&state.role);
    if (ok) { state.step++; render(); }
  }
  else if (act === "back") { if (state.step>1) { state.step--; render(); } }
  else if (act === "forge") {
    if (state.god && state.mode && state.role && state.objs.size) {
      state.result = forgeBuild(state.god, state.role, state.mode, [...state.objs]); render();
      window.scrollTo({ top:0, behavior:"smooth" });
    }
  }
  else if (act === "edit") { state.result = null; state.step = 4; render(); }
  else if (act === "reset") {
    state.step=1; state.god=null; state.mode=null; state.role=null; state.objs=new Set(); state.result=null; state.q=""; state.pFilter="All"; render();
  }
});

render();
</script>
</body>
</html>
